<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Relay Control</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #1e88e5;
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.off {
      background-color: #e53935;
    }
    .relay-card {
      background: #f9f9f9;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    #dashboard {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- GİRİŞ FORMASI -->
    <div id="loginForm">
      <h2>Giriş</h2>
      <input type="email" id="email" placeholder="E-poçt ünvanı">
      <input type="password" id="password" placeholder="Şifrə">
      <button id="loginBtn">Daxil ol</button>
    </div>

    <!-- İDARƏETMƏ PANELSİ VƏ DÜYMƏLƏR -->
    <div id="dashboard">
      <h2>ESP32 İdarəetmə Paneli</h2>
      <p>Xoş gəldiniz!</p>
      
      <div class="relay-card">
        <h3>Rele 1</h3>
        <button id="relay1Btn" onclick="toggleRelay('relay1')">Yandır / Söndür</button>
      </div>

      <div class="relay-card">
        <h3>Rele 2</h3>
        <button id="relay2Btn" onclick="toggleRelay('relay2')">Yandır / Söndür</button>
      </div>

      <div class="relay-card">
        <h3>Rele 3</h3>
        <button id="relay3Btn" onclick="toggleRelay('relay3')">Yandır / Söndür</button>
      </div>

      <div class="relay-card">
        <h3>Rele 4</h3>
        <button id="relay4Btn" onclick="toggleRelay('relay4')">Yandır / Söndür</button>
      </div>

      <button onclick="location.reload()" style="background-color: #757575; margin-top: 20px;">Çıxış et</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWJouUc-1MjYoRbtVSSdEYk1PGGCi8ons",
      authDomain: "esp32relaycontrole.firebaseapp.com",
      databaseURL: "https://esp32relaycontrole-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esp32relaycontrole",
      storageBucket: "esp32relaycontrole.firebasestorage.app",
      messagingSenderId: "909156881015",
      appId: "1:909156881015:web:1a339f8ab9a94aec37ec72"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const allowedEmails = [
      "ayanxx911@gmail.com",
      "sumbuildersteam@gmail.com"
    ];

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Zəhmət olmasa e-poçt və şifrəni daxil edin.");
        return;
      }

      if (!allowedEmails.includes(email)) {
        alert("Bu e-poçt ünvanına giriş icazəsi verilməyib!");
        return;
      }

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          loginForm.style.display = "none";
          dashboard.style.display = "block";
        })
        .catch((error) => {
          alert("E-poçt və ya şifrə yanlışdır!");
        });
    });

    // Releləri idarə etmək üçün funksiya
    let relayStates = { relay1: false, relay2: false, relay3: false, relay4: false };

    function toggleRelay(relay) {
      relayStates[relay] = !relayStates[relay];
      database.ref('relays/' + relay).set(relayStates[relay]);
      alert(relay + " vəziyyəti dəyişdirildi: " + (relayStates[relay] ? "AÇIQ" : "KAPALI"));
    }
  </script>

</body>
</html>
