<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Relay Control</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0 20px;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
      outline-offset: 2px;
      transition: border-color 0.3s ease;
    }
    input:focus {
      border-color: #1e88e5;
    }
    button {
      width: 100%;
      background-color: #1e88e5;
      color: white;
      padding: 12px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #1565c0;
    }
    #dashboard {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h2>Giriş</h2>
      <input type="email" id="email" placeholder="E-poçt ünvanı">
      <input type="password" id="password" placeholder="Şifrə">
      <button id="loginBtn">Daxil ol</button>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="dashboard">
      <h2>ESP32 İdarəetmə Paneli</h2>
      <p>Xoş gəldiniz! Sistemə uğurla daxil oldunuz.</p>
    </div>
  </div>

  <script>
    // Firebase konfiqurasiyası
    const firebaseConfig = {
      apiKey: "AIzaSyBWJouUc-1MjYoRbtVSSdEYk1PGGCi8ons",
      authDomain: "esp32relaycontrole.firebaseapp.com",
      databaseURL: "https://esp32relaycontrole-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esp32relaycontrole",
      storageBucket: "esp32relaycontrole.firebasestorage.app",
      messagingSenderId: "909156881015",
      appId: "1:909156881015:web:1a339f8ab9a94aec37ec72"
    };

    firebase.initializeApp(firebaseConfig);

    // Yalnız bu e-poçtlara icazə verilir:
    const allowedEmails = [
      "ayanxx911@gmail.com",
      "sumbuildersteam@gmail.com"
    ];

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Zəhmət olmasa e-poçt və şifrəni daxil edin.");
        return;
      }

      // Siyahı yoxlanışı
      if (!allowedEmails.includes(email)) {
        alert("Bu e-poçt ünvanına giriş icazəsi verilməyib!");
        return;
      }

      // Firebase daxilolma
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          loginForm.style.display = "none";
          dashboard.style.display = "block";
        })
        .catch((error) => {
          alert("E-poçt və ya şifrə yanlışdır!");
        });
    });
  </script>

</body>
</html>
